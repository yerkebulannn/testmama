<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр: подготовка к тесту</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#1d2a33;--mute:#667780;--line:#d9d4c8;--acc:#1f4e5f;--accfg:#fff;--ok:#1d7a4d;--okbg:#e0f1e6;--bad:#b3362b;--badbg:#f8e1de;--warn:#8a6100;--warnbg:#fbf0d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13191d;--card:#1b2429;--ink:#e6ebee;--mute:#93a3ab;--line:#2f3c43;--acc:#7cc0d4;--accfg:#0d1a20;--ok:#6fd09b;--okbg:#17352a;--bad:#ff8f84;--badbg:#3b1d1a;--warn:#e8c46a;--warnbg:#3a2f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13191d;--card:#1b2429;--ink:#e6ebee;--mute:#93a3ab;--line:#2f3c43;--acc:#7cc0d4;--accfg:#0d1a20;--ok:#6fd09b;--okbg:#17352a;--bad:#ff8f84;--badbg:#3b1d1a;--warn:#e8c46a;--warnbg:#3a2f12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.row .t{flex:1;min-width:0}
.row .m{color:var(--mute);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mode{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;text-align:left;font:inherit;cursor:pointer}
.mode b{display:block}
.mode span{color:var(--mute);font-size:13px}
.mode[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:600 16px inherit;font-family:inherit;background:var(--acc);color:var(--accfg);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mute)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .l{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad .l{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt:disabled{cursor:default;color:var(--ink)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top button{border:0;background:none;color:var(--acc);font:inherit;cursor:pointer;padding:6px 0}
.top .c{margin-left:auto;color:var(--mute);font-size:14px}
.q{font:500 20px/1.4 Georgia,"Times New Roman",serif;margin:18px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.topic{color:var(--mute);font-size:13px}
.score{font:600 44px/1 Georgia,serif;margin:12px 0 4px}
.wr{border-top:1px solid var(--line);padding:12px 0}
.wr p{margin:0 0 6px}
.wr .a{color:var(--ok)}
.wr .y{color:var(--bad)}
.gap{height:10px}
.sw{display:flex;gap:8px;align-items:center;margin:4px 0 14px;color:var(--mute);font-size:14px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--acc)}
.rst{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;margin-top:18px;padding:0}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = {"topics":[{"k":"gpk","t":"Гражданский процессуальный кодекс (ГПК)","n":100},{"k":"koap","t":"Кодекс об административных правонарушениях (КоАП)","n":101},{"k":"corr","t":"Закон «О противодействии коррупции»","n":32},{"k":"sed","t":"Закон «О судебно-экспертной деятельности»","n":101},{"k":"r305","t":"Правила обращения с объектами экспертизы (305)","n":25},{"k":"upk","t":"Уголовно-процессуальный кодекс (УПК)","n":100},{"k":"eth","t":"Кодекс этики судебного эксперта","n":30}],"qs":[{"id":"gpk-1","k":"gpk","n":1,"q":"Гражданские дела в суде первой инстанции рассматриваются и разрешаются судьей","o":["коллегиальным составом","единолично или коллегиально","единолично, который действует от имени суда","с участием судебного пристава"],"a":2,"g":0},{"id":"gpk-2","k":"gpk","n":2,"q":"Лицо, участвующее в деле, — это:","o":["судья","свидетель","эксперт","прокурор"],"a":3,"g":0},{"id":"gpk-3","k":"gpk","n":3,"q":"Стороной в гражданском процессе является:","o":["свидетель","судья","прокурор","истец"],"a":3,"g":0},{"id":"gpk-4","k":"gpk","n":4,"q":"Правом изменения отказа от иска обладает:","o":["истец","ответчик","прокурор","свидетель"],"a":0,"g":0},{"id":"gpk-5","k":"gpk","n":5,"q":"Какое процессуальное положение занимает лицо, не заявляющее самостоятельных требований, вступающее в уже возникший процесс на стороне истца или ответчика?","o":["представитель ответчика","представитель истца","третье лицо, не заявляющее самостоятельные требования","процессуальный соучастник"],"a":2,"g":0},{"id":"gpk-6","k":"gpk","n":6,"q":"Какое процессуальное положение занимает лицо, заявляющее самостоятельные требования, вступающее в уже возникший процесс?","o":["представитель истца","представитель ответчика","истец","третье лицо, заявляющее самостоятельные требования"],"a":3,"g":0},{"id":"gpk-7","k":"gpk","n":7,"q":"Гражданская процессуальная дееспособность принадлежит в полном объеме:","o":["гражданам, достигшими 18 лет и организациям","физическим лицам, достигшим 17 лет","юридическим лицам","гражданам, достигшим 16 лет"],"a":0,"g":0},{"id":"gpk-8","k":"gpk","n":8,"q":"Языком судопроизводства является:","o":["государственный язык","казахский язык, наравне с казахским употребляется русский язык, а в установленных законом случаях и другие языки","государственный язык, а при необходимости наравне с ним употребляется русский язык и другие языки","язык межнационального общения (русский язык)"],"a":1,"g":0},{"id":"gpk-9","k":"gpk","n":9,"q":"Правоспособность гражданина возникает в момент:","o":["вступления в брак","его рождения","рождения у него первого ребенка","призыва в ряды вооруженных сил"],"a":1,"g":0},{"id":"gpk-10","k":"gpk","n":10,"q":"Допрос несовершеннолетнего свидетеля производится с участием:","o":["родителей и законных представителей","только родителей","педагога и законных представителей","родителей и психолога"],"a":2,"g":0},{"id":"gpk-11","k":"gpk","n":11,"q":"Представителем в суде может быть:","o":["дееспособное лицо, которое совершает процессуальные действия в пределах предоставленных ему полномочий от имени и в интересах представляемого","лицо, участвующее на стороне истца или ответчика в связи с тем, что решение по делу может повлиять на его права или обязанности по отношению к одной из сторон","лицо, которое совершает процессуальное действие в пределах предоставленных ему доверителем полномочий","дееспособное лицо, имеющее надлежащим образом оформленные полномочия на ведение дела в суде, основанные на доверенности, законодательстве Республики Казахстан, решении суда либо административном акте"],"a":3,"g":0},{"id":"gpk-12","k":"gpk","n":12,"q":"Судебные расходы — это:","o":["государственная пошлины","издержки, связанные с рассмотрением дела;","расходы по оплате помощи адвоката;","государственная пошлина и издержки, связанные с производством по делу."],"a":3,"g":0},{"id":"gpk-13","k":"gpk","n":13,"q":"Государственная пошлина — это:","o":["сумма, выплачиваемая заинтересованным лицом в связи с производством по гражданскому делу","установленный государством денежный сбор, взимаемый с юридических и физических лиц, в интересах которых специально уполномоченные органы совершают действия и выдают документы, имеющие юридическое значение","сумма, подлежащая выплате свидетелю и эксперту","платеж в бюджет, взимаемый за совершение юридически значимых действий уполномоченными государственными органами или должностными лицами"],"a":3,"g":0},{"id":"gpk-14","k":"gpk","n":14,"q":"Судебные издержки — это:","o":["сумма, выплачиваемая заинтересованным лицом в связи с производством по гражданскому делу","установленный государством денежный сбор, взимаемый с юридических и физических лиц, в интересах которых специально уполномоченные органы совершают действия и выдают документы, имеющие юридическое значение","сумма, подлежащая выплате свидетелю и эксперту","сумма, подлежащая выплате свидетелям, экспертам, специалистам, расходы, связанные с производством осмотра на месте, розыска ответчика и ребенка и другие признанные судом подлежащими возмещению"],"a":3,"g":0},{"id":"gpk-15","k":"gpk","n":15,"q":"Размер государственной пошлины устанавливается:","o":["прокурором","представителем истца","законом","судом"],"a":2,"g":0},{"id":"gpk-16","k":"gpk","n":16,"q":"Какой из органов обеспечивает доказательства до возбуждения дела в суде?","o":["нотариат","прокурор","суд","органы государственного управления, дающие заключение по делу"],"a":0,"g":0},{"id":"gpk-17","k":"gpk","n":17,"q":"Письменные доказательства — это:","o":["акты, документы, письма делового или личного характера, содержащие сведения об обстоятельствах, имеющих значение для дела","объяснение стороны или третьего лица, содержащее сведения о фактах, которые должна доказать другая сторона или третье лицо","предметы, на которых посредством знаков выражены сведения о фактах, имеющие значение для решения дела","сообщение сторон об интересующих суд фактах"],"a":0,"g":0},{"id":"gpk-18","k":"gpk","n":18,"q":"Вещественные доказательства — это:","o":["предметы, на которых посредством знаков выражены сведения о фактах, имеющие значение для решения дела","предметы, если есть основание полагать, что они своим внешним видом, свойствами или иными признаками могут служить средством установления обстоятельств, имеющих значение для дела","документы, выполненные в форме цифровой, графической записи, в том числе полученные посредством факсимильной, электронной и иной связи либо иным, позволяющим установить достоверность документа способом","предметы, которые своим внешним видом служат установлению обстоятельств, имеющих значение для дела"],"a":1,"g":0},{"id":"gpk-19","k":"gpk","n":19,"q":"При подготовке дела к судебному разбирательству судья:","o":["разъясняет переводчику его права и обязанности","проверяет явку участников процесса","по ходатайству стороны обязывает граждан и юридических лиц представить доказательства, имеющие значение для правильного рассмотрения и разрешения дела, разъясняет правовые последствия","объявляет состав суда"],"a":2,"g":0},{"id":"gpk-20","k":"gpk","n":20,"q":"Общий срок рассмотрения и разрешения гражданских дел в судах общей юрисдикции:","o":["до двух месяцев","до шести месяцев","до четырех месяцев","не установлен"],"a":0,"g":0},{"id":"gpk-21","k":"gpk","n":21,"q":"Судебное заседание начинается:","o":["проверкой явки участников процесса","допросом свидетелей","открытием заседания и объявлением, какое дело подлежит рассмотрению","удалением свидетелей из зала судебного заседания"],"a":2,"g":0},{"id":"gpk-22","k":"gpk","n":22,"q":"Рассмотрение дела по существу начинается:","o":["с выяснения председательствующим вопросов о том, поддерживает ли истец свои требования, признает ли ответчик требования истца и не желают ли стороны окончить дело мировым соглашением или другим установленным законом способом.","объяснениями лиц, участвующих в деле","исследованием письменных доказательств","воспроизведением аудиозаписи"],"a":0,"g":0},{"id":"gpk-23","k":"gpk","n":23,"q":"Судебные прения — это:","o":["заключение прокурора по делу","дополнительные объяснения лиц, участвующих в деле","исследование судом представленных доказательств","речь лиц, участвующих в деле, и их представителей после окончания рассмотрения дела по существу"],"a":3,"g":0},{"id":"gpk-24","k":"gpk","n":24,"q":"Право последней реплики принадлежит:","o":["истцу","свидетелю","прокурору","ответчику"],"a":3,"g":0},{"id":"gpk-25","k":"gpk","n":25,"q":"Укажите, что не является требованием, предъявляемым к судебному решению:","o":["законность","обоснованность","мотивированность","гласность"],"a":3,"g":0},{"id":"gpk-26","k":"gpk","n":26,"q":"Результатом приказного производства в гражданском процессе является:","o":["судебный приказ","встречный иск","судебное поручение","определение"],"a":0,"g":0},{"id":"gpk-27","k":"gpk","n":27,"q":"Реторсия — это:","o":["правовые ограничения государства, устанавливаемые в отношении граждан иностранного государства","правовое положение иностранных граждан за пределами своего государства","привилегии отдельных категорий иностранных граждан за пределами своего государства","передача иностранного гражданина государству, требующему его выдачи"],"a":0,"g":0},{"id":"gpk-28","k":"gpk","n":28,"q":"Мерой обеспечение иска в гражданском процессе не является:","o":["штраф","наложение ареста на имущество ответчика;","запрет на совершение определенных действий с предметом спора.","приостановление торгов по внесудебной реализации предмета залога"],"a":0,"g":0},{"id":"gpk-29","k":"gpk","n":29,"q":"Кто может обратиться в суд с заявлением об объявлении несовершеннолетнего полностью дееспособным?","o":["прокурор","орган опеки и попечительства","законные представители несовершеннолетнего","сам несовершеннолетний"],"a":3,"g":0},{"id":"gpk-30","k":"gpk","n":30,"q":"Решения суда первой инстанции вступает в законную силу:","o":["с момента объявления его судом","со дня вручения его сторонам","со дня возбуждения исполнительного производства","по истечении срока на апелляционное обжалование, принесение апелляционного ходатайс k","n":1,"q":"Преюдиция – это …","o":["факты, не нуждающиеся в доказывании, пока они обоснованно не оспариваются одной из сторон","любые доказанные по уголовному делу обстоятельства, не нуждающиеся в дополнительной проверке","вступивший в законную силу приговор, а также другое решение суда по уголовному делу, разрешающее его по существу","сведения, сообщенные официальным органам на запрос по уголовному делу"],"a":2,"g":0},{"id":"upk-2","k":"upk","n":2,"q":"В качестве источника доказательств могут быть допущены протоколы …","o":["о принятии залога","ознакомления с материалами уголовного дела","допроса свидетелей, потерпевших, подозреваемых, обвиняемых","следственных и судебных действий"],"a":3,"g":0},{"id":"upk-3","k":"upk","n":3,"q":"Гражданский иск может быть предъявлен …","o":["после предъявления обвинения на предварительном следствии","с момента начала досудебного расследования до окончания судебного следствия","в надзорной инстанции","до возбуждения уголовного дела"],"a":1,"g":0},{"id":"upk-4","k":"upk","n":4,"q":"Реабилитация — это …","o":["неустановленная причастность либо установленная непричастность лица к совершению преступления","нахождение подозреваемого или обвиняемого в момент совершения преступления в другом месте","восстановление в правах лиц, незаконно привлеченных к уголовной ответственности и которые не могут быть подвергнуты каким-либо ограничениям в правах и свободах, гарантированных Конституцией Республики Казахстан.","акт амнистии, если он устраняет применение наказания за совершенное деяние"],"a":2,"g":0},{"id":"upk-5","k":"upk","n":5,"q":"Заключение эксперта – это …","o":["документ, содержащий исследование и выводы по вопросам, поставленными перед экспертом сторонами","суждения по вопросам, поставленном перед экспертом лицом, осуществляющим производство по уголовному делу","документ, отражающий содержание исследования и выводы по вопросам, поставленным перед экспертом лицом, ведущим уголовный процесс","документ, отражающий ход и результаты судебно-экспертного исследования"],"a":3,"g":0},{"id":"upk-6","k":"upk","n":6,"q":"Относимость – это …","o":["характеристика доказательства, обосновывающая процессуальное решение","соответствие доказательства обстоятельствам, имеющим отношение к делу","получение доказательств из надлежащего источника","фиксация доказательства в установленной законом процессуальной форме"],"a":1,"g":0},{"id":"upk-7","k":"upk","n":7,"q":"Подозреваемый — это:","o":["лицо, в отношении которого избрана мера пресечения до предъявления ему обвинения","лицо, которое подозревается в совершении преступления","лицо, в отношении которого имеются обоснованные данные для привлечения его в качестве подозреваемого","лицо, в отношении которого вынесено постановление о признании в качестве подозреваемого, согласованное с прокурором"],"a":3,"g":0},{"id":"upk-8","k":"upk","n":8,"q":"Жилищем признается …","o":["индивидуальный жилой дом с входящими в него жилыми помещениями","помещение или строение для временного или постоянного проживания одного или нескольких лиц, в том числе: собственные или арендуемые квартира, дом, садовый дом, гостиничный номер, каюта, купе; непосредственно примыкающие к ним веранды, террасы, галереи, балконы, мансардные строения, подвал и чердак жилого строения, кроме многоквартирного жилого дома, а также речное или морское судно и другие;","жилое помещение независимо от формы собственности, входящее в жилищный фонд и используемое для постоянного или временного проживания","индивидуальный жилой дом с входящими в него жилыми и нежилыми помещениями, жилое помещение независимо от формы собственности, входящее в жилищный фонд и используемое для постоянного или временного проживания, а равно иное помещение или строение, используемое для временного проживания"],"a":1,"g":0},{"id":"upk-9","k":"upk","n":9,"q":"Вещественные доказательства – предметы …","o":["изъятые с места преступления","служившие орудием или сохранили на себе следы уголовного правонарушения","обнаруженные на месте преступления","переданные следователю свидетелем, потерпевшим, подозреваемым, обвиняемым"],"a":1,"g":0},{"id":"upk-10","k":"upk","n":10,"q":"Допустимость – это …","o":["соответствие доказательства реальным обстоятельствам дела","характеристика доказательства, обосновывающая процессуальное решение","законность получения доказательств","получение доказательств надлежащим субъектом доказывания"],"a":2,"g":0},{"id":"upk-11","k":"upk","n":11,"q":"Досудебное соглашение о сотрудничестве – это …","o":["заявление о преступлении, явка с повинной, рапорт об обнаружении преступления","соглашение между сторонами обвинения и защиты о сотрудничестве, о признании вины подозреваемым/обвиняемым, содействии следствию в раскрытии уголовного правонарушения и возмещении ущерба","разрешение руководителя следственного органа на производство следователем или разрешение прокурора на производство дознавателем соответствующих следственных и иных процессуальных действий и на принятие ими процессуальных решений","прекращение уголовного преследования в связи с деятельным раскаянием"],"a":1,"g":0},{"id":"upk-12","k":"upk","n":12,"q":"Заключение специалиста – представленное (ые) в письменном виде …","o":["суждение по вопросам, поставленным перед специалистом лицом, осуществляющим производство по уголовному делу или сторонами","содержание исследования и выводы по вопросам, поставленными перед специалистом сторонами","содержание исследования и выводы по вопросам, поставленным перед специалистом лицом, ведущим уголовный процесс или сторонами","суждение по вопросам, поставленным перед специалистом сторонами"],"a":2,"g":0},{"id":"upk-13","k":"upk","n":13,"q":"Не подлежит доказыванию по уголовному делу","o":["характер, размер вреда, причиненного уголовным правонарушением","событие уголовного правонарушения","обстоятельства, смягчающие или отягчающие наказание","знание лицом закона"],"a":3,"g":0},{"id":"upk-14","k":"upk","n":14,"q":"Уголовное дело подлежит прекращению …","o":["когда обвиняемый не возражает против прекращения уголовного преследования в предусмотренных законом случаях","за истечением срока давности привлечения к уголовной ответственности","в связи с деятельным раскаянием","все перечисленное"],"a":1,"g":0},{"id":"upk-15","k":"upk","n":15,"q":"Специальные знания –","o":["не общеизвестные в уголовном процессе знания, приобретенные лицом в ходе профессионального обучения либо практической деятельности, используемые для решения задач уголовного судопроизводства","область специальных знаний, содержание которой составляют научные знания, реализованные в методиках судебно-экспертных исследований","область специальных знаний, содержание которой составляют научные знания","область специальных знаний, содержание которой составляют разные отрасли знания"],"a":0,"g":0},{"id":"upk-16","k":"upk","n":16,"q":"Распространяется ли действие уголовно-процессуального закона на иностранных граждан?","o":["да","нет","да, с их согласия и при их просьбе об этом","да, если они задержаны непосредственно при совершении преступления"],"a":0,"g":0},{"id":"upk-17","k":"upk","n":17,"q":"Оценка доказательств, по внутреннему убеждению, означает, что доказательства оцениваются:","o":["руководствуясь законом и совестью","с точки зрения виновности или невиновности подозреваемого","на соответствие выдвинутым версиям","прокурором в ходе осуществления надзора"],"a":0,"g":0},{"id":"upk-18","k":"upk","n":18,"q":"Обвиняемый — это:","o":["лицо, в отношении которого прокурором составлен обвинительный акт","лицо, которому предъявлено обвинение;","лицо, дело в отношении которого принято к производству судом;","лицо, которое обвиняется в совершении преступления."],"a":0,"g":0},{"id":"upk-19","k":"upk","n":19,"q":"Какое следственное действие может быть проведено с целью устранения существенных противоречий в показаниях:","o":["проверка показаний на месте","повторный допрос","очная ставка","все указанные ответы правильные"],"a":2,"g":0},{"id":"upk-20","k":"upk","n":20,"q":"Судебное разбирательство может быть приостановлено:","o":["при необходимости истребования новых доказательств","временного психического расстройства или иного тяжелого заболевания подсудимого, удостоверенного в предусмотренном законом порядке","во всех этих случаях судебное разбирательство может быть приостановлено","ни в одном из этих случаев судебное разбирательство не может быть приостановлено"],"a":1,"g":0},{"id":"upk-21","k":"upk","n":21,"q":"Судебное следствие может быть возобновлено:","o":["если участники прений или подсудимый в последнем слове сообщат о новых обстоятельствах, имеющих значение для уголовного дела","по решению прокурора;","в случае судебной ошибки;","во всех этих случаях."],"a":0,"g":0},{"id":"upk-22","k":"upk","n":22,"q":"Достаточность – это …","o":["соответствие доказательства обстоятельствам, имеющим отношение к делу","законность получения доказательств","соответствие доказательства реальным обстоятельствам дела","совокупность доказательств, необходимая для правильного разрешения дела и неоспоримо устанавливающая истину"],"a":3,"g":0},{"id":"upk-23","k":"upk","n":23,"q":"Близкие родственники:","o":["лица, состоящие в родстве с потерпевшим, свидетелем, а также лица, жизнь, здоровье и благополучие которых дороги потерпевшему, свидетелю в силу сложившихся личных отношений","родители, дети, усыновители, усыновленные, полнородные и неполнородные братья и родные сестры, дедушка, бабушка, внуки","лица состоящие в родстве","все перечисленное"],"a":1,"g":0},{"id":"upk-24","k":"upk","n":24,"q":"Частный обвинитель – это …","o":["лицо, подавшее жалобу в суд по делу частного обвинения и поддерживающее обвинение в суде, потерпевший или его законный представитель","представитель по уголовным делам частного обвинения","прокурор иные должностные лица органов прокуратуры, участвующие в уголовном судопроизводстве и наделенные соответствующими полномочиями","все перечисленное"],"a":0,"g":0},{"id":"upk-25","k":"upk","n":25,"q":"Имеет ли право начальник следственного отдела отменить постановление следователя?","o":["нет","да, в любом случае","да, если постановление незаконное или необоснованное","да, если об этом будет указание прокурора"],"a":0,"g":0},{"id":"upk-26","k":"upk","n":26,"q":"Какая мера процессуального принуждения может быть применена до возбуждения дела?","o":["обязательство о явке;","процессуальное задержание подозреваемого;","поручительство;","привод."],"a":1,"g":0},{"id":"upk-27","k":"upk","n":27,"q":"В каком следственном действии обязательно участие специалиста?","o":["следственном эксперименте;","в том следственном действии, при производстве которого применяется видео-звукозапись;","осмотре трупа;","освидетельствовании, связанным с обнаружением освидетельствуемого."],"a":2,"g":0},{"id":"upk-28","k":"upk","n":28,"q":"Чем исчисляются процессуальные сроки в соответствии с УПК РК?","o":["часами, сутками и месяцами, годами;","минутами, часами и днями;","сутками, месяцами и годами;","месяцами, кварталами и годами."],"a":0,"g":0},{"id":"upk-29","k":"upk","n":29,"q":"Предельный срок предварительного следствия:","o":["составляет 6 месяцев;","составляет 1 год;","составляет 18 месяцев;","составляет 2 месяца."],"a":3,"g":0},{"id":"upk-30","k":"upk","n":30,"q":"Если в результате преступления наступила смерть потерпевшего, то его близкие родственники признаются:","o":["потерпевшими по делу;","представителями потерпевшего по делу;","гражданскими истцами;","данный вопрос является спорным."],"a":0,"g":0},{"id":"upk-31","k":"upk","n":31,"q":"При производстве освидетельствования всегда является обязательным:","o":["присутствие врача;","присутствие понятых одного пола с освидетельствуемым лицом;","согласие потерпевшего и свидетеля на их освидетельствование;","вынесение постановления о производстве освидетельствования."],"a":3,"g":0},{"id":"upk-32","k":"upk","n":32,"q":"Доказательства – это:","o":["законно полученные фактические данные","любые данные;","любые законно полученные данные;","фактические данные о совершаемом или совершенном уголовном правонарушении"],"a":0,"g":0},{"id":"upk-33","k":"upk","n":33,"q":"Обыск производится с целью:","o":["обнаружения предметов, являющихся доказательствами","обнаружения и изъятия предметов или документов, имеющих значение для дела","обнаружения и изъятия вещей, документов, драгоценностей, добытых преступным путем","изъятия определенных предметов и документов, имеющих значение для дела, если точно известно, где и у кого они находятся"],"a":1,"g":0},{"id":"upk-34","k":"upk","n":34,"q":"Выемка производится с целью:","o":["обнаружения предметов, являющихся доказательствами","обнаружения и изъятия предметов или документов, имеющих значение для дела","обнаружения и изъятия вещей, документов, драгоценностей, добытых преступным путем","изъятия определенных предметов и документов, имеющих значение для дела, если точно известно, где и у кого они находятся"],"a":3,"g":0},{"id":"upk-35","k":"upk","n":35,"q":"Объект (предмет) признается вещественным доказательством с момента:","o":["его оценки путем приобщения к уголовному делу соответствующим постановлением","его обнаружения в процессе следственного действия","его предварительной оценки органом, ведущим процесс, до исследования (проверки)","его обнаружения у подозреваемого"],"a":0,"g":0},{"id":"upk-36","k":"upk","n":36,"q":"Обстоятельства, исключающие производство по делу:","o":["в отношении лица, подлежащего освобождению от уголовной ответственности","в отношении лица имеется вступивший в законную силу приговор суда по тому же обвинению","вследствии акта амнистии","все перечисленные обстоятельства"],"a":3,"g":0},{"id":"upk-37","k":"upk","n":37,"q":"Принципами уголовного процесса являются:","o":["презумпция невиновности","недопустимость повторного осуждения и уголовного преследования","свобода на обжалования процессуальных действий и решений","все перечисленное"],"a":3,"g":0},{"id":"upk-38","k":"upk","n":38,"q":"Язык уголовного судопроизводства:","o":["уголовное судопроизводство в Республике Казахстан ведется только на государственном языке","уголовное судопроизводство в Республике Казахстан ведется на государственном языке, а при необходимости в судопроизводстве наравне с государственным употребляется русский язык или другие языки","уголовное судопроизводство в Республике Казахстан ведется на русском или других языках после вынесения мотивированного постановление об изменении языка судопроизводства","уголовное судопроизводство в Республике Казахстан ведется на казахском языке, наравне с казахским официально в судопроизводстве употребляется русский язык, а при необходимости и другие языки"],"a":3,"g":0},{"id":"upk-39","k":"upk","n":39,"q":"Презумпция невиновности означает:","o":["подозреваемый считается невиновным, пока не будет вынесено постановление о задержании","обвиняемый считается невиновным, пока ему не предъявлено обвинение в совершении преступления","каждый считается невиновным, пока его виновность в совершении уголовного правонарушения не будет доказана приговором суда, вступившего в законную силу","все перечисленное"],"a":2,"g":0},{"id":"upk-40","k":"upk","n":40,"q":"У каких лиц могут быть получены образцы в принудительном порядке?","o":["у подозреваемого, обвиняемого","у потерпевшего, свидетеля","у подозреваемого, свидетеля","у потерпевшего, обвиняемого"],"a":0,"g":0},{"id":"upk-41","k":"upk","n":41,"q":"Назначение и производство экспертизы обязательны, если по делу необходимо установить:","o":["причину смерти, характер и степень тяжести причиненного вреда здоровью","возраст подозреваемого, когда это имеет значение для дела, а документы о возрасте отсутствуют или вызывают сомнение","психическое или физическое состояние потерпевшего, свидетеля в случаях, когда возникают сомнения по поводу их способности правильно воспринимать обстоятельства","все перечисленное"],"a":3,"g":0},{"id":"upk-42","k":"upk","n":42,"q":"Допрос не может продолжаться непрерывно:","o":["более 6 часов","более 4 часов","более 3 часов","более 2 часов"],"a":1,"g":0},{"id":"upk-43","k":"upk","n":43,"q":"Являются ли устные пояснения эксперта доказательствами?","o":["являются доказательствами лишь в части разъяснения, данного им ранее заключения","да, являются самостоятельными доказательствами","не являются доказательствами","являются доказательствами, в случае, когда пояснение эксперта принимается судом"],"a":0,"g":0},{"id":"upk-44","k":"upk","n":44,"q":"Может ли подозреваемый присутствовать при производстве экспертизы?","o":["не может","может, в случаях, предусмотренных законом","может, с разрешения прокурора","может, только при совершении тяжкого уголовного правонарушения"],"a":1,"g":0},{"id":"upk-45","k":"upk","n":45,"q":"В случае, если эксперт до проведения исследования убеждается, что поставленные перед ним вопросы выходят за пределы его специальных научных знаний, он:","o":["составляет мотивированное сообщение о невозможности дать заключение","составляет заключение эксперта с выводом НПВ","составляет возврат без исполнения","сообщает органу, назначившему экспертизу"],"a":0,"g":0},{"id":"upk-46","k":"upk","n":46,"q":"За отказ или уклонение от выполнения своих обязанностей без уважительных причин специалист:","o":["несет административную ответственность","несет дисциплинарную ответственность","несет уголовную ответственность","на него налагается денежное взыскание"],"a":3,"g":0},{"id":"upk-47","k":"upk","n":47,"q":"Принцип законности в уголовном процессе означает, что:","o":["суд, прокурор, следователь, орган дознания и дознаватель при производстве по уголовным делам обязаны точно соблюдать требования Конституции РК, УПК РК и иных нормативных правовых актов","правосудие по уголовным делам осуществляется только судом","каждый имеет право на судебную защиту своих прав и свобод","правосудие осуществляется на началах равенства всех перед законом и судом"],"a":0,"g":0},{"id":"upk-48","k":"upk","n":48,"q":"Для установления причин смерти и характера телесных повреждений назначается:","o":["судебно-медицинская экспертиза","молекулярно-генетическая экспертиза","биологическая экспертиза","экспертиза телесных повреждений"],"a":0,"g":0},{"id":"upk-49","k":"upk","n":49,"q":"Принцип гласности в уголовном процессе означает:","o":["разбирательство уголовных дел во всех судах и во всех судебных инстанциях происходит открыто","правосудие осуществляется на началах равенства всех перед законом и судом","государство обеспечивает каждому доступ к правосудию","каждый имеет право на судебную защиту своих прав и свобод"],"a":0,"g":0},{"id":"upk-50","k":"upk","n":50,"q":"Кто первым выступает в судебных прениях?","o":["обвинитель;","защитник;","последовательность выступлений определяется судом;","данный вопрос законодательством не урегулирован."],"a":0,"g":0},{"id":"upk-51","k":"upk","n":51,"q":"При производстве обыска следователь обязан:","o":["произвести личный обыск лица, находящегося в обыскиваемом помещении;","во всяком случае обеспечить присутствие лица, у которого производится обыск;","предъявлять все изымаемые предметы понятым и другим присутствующим лицам;","запретить общаться лицам, присутствующим при обыске."],"a":2,"g":0},{"id":"upk-52","k":"upk","n":52,"q":"На кого возлагаются процессуальные издержки?","o":["на органы предварительного расследования","на обвиняемого в случае оправдательного приговора","на подозреваемого, обвиняемого, осужденного","все перечисленное"],"a":2,"g":0},{"id":"upk-53","k":"upk","n":53,"q":"Какой документ не является процессуальным решением?","o":["определение суда.","протокол судебного заседания;","протокол задержания подозреваемого;","обвинительное заключение;"],"a":1,"g":0},{"id":"upk-54","k":"upk","n":54,"q":"Досудебное расследование осуществляется в форме:","o":["предварительной проверки заявлений о преступлениях.","подготовки материалов сторонами по делам частного обвинения","дознания по делам, по которым производство предварительного следствия необязательно","все перечисленное"],"a":2,"g":0},{"id":"upk-55","k":"upk","n":55,"q":"Участие педагога или психолога является обязательным при производстве процессуальных действий с участием несовершеннолетнего подозреваемого, обвиняемого, подсудимого, если он не достиг:","o":["10 лет;","12 лет;","16 лет;","18 лет."],"a":2,"g":0},{"id":"upk-56","k":"upk","n":56,"q":"Основное отличие выемки от обыска состоит в:","o":["отсутствии поисковых действий при ее производстве;","составе участвующих лиц;","возможности ее производства до возбуждения уголовного дела;","необязательном участии понятых."],"a":0,"g":0},{"id":"upk-57","k":"upk","n":57,"q":"В каком случае выемка производится с санкции суда?","o":["в любом случае","если при выемке не участвуют понятые","если изымаемые документы содержат сведения, являющиеся государственной тайной","если выемка производится лицом, производящим дознание"],"a":2,"g":0},{"id":"upk-58","k":"upk","n":58,"q":"Не требуется участие понятых при производстве:","o":["освидетельствования","контроля и записи переговоров","производства экспертизы","все перечисленное"],"a":3,"g":0},{"id":"upk-59","k":"upk","n":59,"q":"К мерам пресечения не относятся:","o":["общественное поручительство","домашний арест;","под стражу;","залог"],"a":0,"g":0},{"id":"upk-60","k":"upk","n":60,"q":"В каком документе непосредственно фиксируется вердикт присяжных заседателей?","o":["в вопросном листе","в приговоре присяжных","документ так и называется - вердикт","в определении"],"a":0,"g":0},{"id":"upk-61","k":"upk","n":61,"q":"Может ли вопрос о назначении судебного разбирательство решаться с участием сторон?","o":["нет, вопрос о назначении судебного разбирательства в общем порядке решается судьей единолично, без обязательного участия сторон","да, если предание суду облечено в форму предварительного слушания дела;","да, если этот вопрос решается прокурором.","да, вопрос о назначении судебного разбирательства решается судьей c обязательным участием сторон"],"a":0,"g":0},{"id":"upk-62","k":"upk","n":62,"q":"Может ли защитник первым задавать вопросы потерпевшему во время его допроса в судебном заседании?","o":["не может, так как первым вопросы задает сторона обвинения","да, с разрешения суда","да, при согласии самого потерпевшего;","да, если потерпевший допрашивается по ходатайству защиты."],"a":3,"g":0},{"id":"upk-63","k":"upk","n":63,"q":"Суд выносит обвинительный приговор с освобождением от наказания, если к моменту рассмотрения дела в суде:","o":["необходимо применить наказание условно;","не доказано участие подсудимого в совершении преступления;","деяние потеряло общественную опасность;","издан акт амнистии."],"a":3,"g":0},{"id":"upk-64","k":"upk","n":64,"q":"Мера пресечения в виде содержания под стражей применяется к несовершеннолетнему","o":["лишь в тех случаях, когда другие меры пресечения по имеющимся в деле обстоятельствам не могут быть применены.","на срок, не превышающий одного месяца;","по указанию прокурора;","не допускается."],"a":0,"g":0},{"id":"upk-65","k":"upk","n":65,"q":"Надо ли предоставлять последнее слово подсудимому, если он сам выступал в судебных прениях?","o":["не надо, если подсудимый сам не просит об этом","надо, в любом случае","не надо, так как выступление подсудимого в судебных прениях лишает его права на последнее слово","не надо, если в судебных прениях подсудимый выступал самым последним"],"a":1,"g":0},{"id":"upk-66","k":"upk","n":66,"q":"Законный представитель несовершеннолетнего обвиняемого это:","o":["родители, усыновители, опекуны, попечители","близкий родственник обвиняемого","братья, сестры","дедушка, бабушка"],"a":0,"g":0},{"id":"upk-67","k":"upk","n":67,"q":"Какой вопрос не решает коллегия присяжных заседателей?","o":["содержит ли это деяние состав преступления","виновен ли подсудимый в совершении этого деяния","совершил ли деяние подсудимый","имело ли место деяние, в совершении которого обвиняется подсудимый"],"a":0,"g":0},{"id":"upk-68","k":"upk","n":68,"q":"Какое положение является принципом уголовного процесса?","o":["выяснение причин и условий, способствовавших совершению преступления","независимость судей и подчинение их только закону","быстрота и полнота расследования преступления","презумпция правосудности приговора"],"a":1,"g":0},{"id":"upk-69","k":"upk","n":69,"q":"К стадии исполнения приговора относится:","o":["проверка законности и обоснованности приговора;","наложение на осужденных административных взысканий;","досмотр корреспонденции осужденных;","условно-досрочное освобождение осужденных."],"a":3,"g":0},{"id":"upk-70","k":"upk","n":70,"q":"Какой вопрос не решается в стадии исполнения приговора?","o":["о снятии судимости;","о наложении административного взыскания на осужденного;","об отсрочке исполнения приговора;","об изменении вида наказания."],"a":1,"g":0},{"id":"upk-71","k":"upk","n":71,"q":"Кто применяет в отношении несовершеннолетнего принудительные меры медицинского характера?","o":["орган дознания","следователь","прокурор","суд."],"a":3,"g":0},{"id":"upk-72","k":"upk","n":72,"q":"Освидетельствование проводится с целью:","o":["обнаружения на теле человека особых примет, следов уголовного правонарушения, признаков причинения вреда здоровью, выявления состояния опьянения или иных свойств и признаков;","установление тождества или различия лица среди присутствующих статистов;","выявления у лица физиологических или психических отклонений;","опознания трупа близкими родственниками."],"a":0,"g":0},{"id":"upk-73","k":"upk","n":73,"q":"Уголовное судопроизводство осуществляется в соответствии с уголовно-процессуальным законом, действующим:","o":["во время совершения преступления","во время обнаружения преступления","в момент возбуждения уголовного дела","в момент производства соответствующего процессуального действия или принятия процессуального решения"],"a":3,"g":1},{"id":"upk-74","k":"upk","n":74,"q":"Что понимается под правом экспертной инициативы:","o":["право указывать в заключение обстоятельства, имеющие значение для дела, выходящие за пределы вопросов, содержащихся в постановлении о назначении судебной экспертизы","право указывать в заключение по согласованию с органом, назначившим экспертизу, обстоятельства, имеющие значение для дела, выходящие за пределы вопросов, содержащихся в постановлении о назначении судебной экспертизы","право проведение дополнительной экспертизы, если эксперт считает, что предыдущие заключение является неполным","право проведение независимой экспертизы по своей инициативе"],"a":1,"g":0},{"id":"upk-75","k":"upk","n":75,"q":"Принципами уголовного процесса являются:","o":["презумпция невиновности","гласность","право на обжалование процессуальных действий и решений","все перечисленные принципы"],"a":3,"g":0},{"id":"upk-76","k":"upk","n":76,"q":"Залог применяется только:","o":["по постановлению следователя, санкционированного прокурором","с санкции следственного судьи либо по постановлению суда","с санкции прокурора либо по решению суда","по решению суда либо по постановлению органа, ведущего уголовный процесс"],"a":1,"g":0},{"id":"upk-77","k":"upk","n":77,"q":"На основании какого процессуального документа производится обыск в жилище?","o":["определения суда","постановления следователя, санкционированного прокурором","судебного решения","постановления лица, осуществляющего досудебное расследование, санкционированного следственным судьей"],"a":3,"g":0},{"id":"upk-78","k":"upk","n":78,"q":"За дачу заведомо ложного заключения специалист:","o":["несет административную ответственность","несет дисциплинарную ответственность","несет уголовную ответственность","может быть наложено денежное взыскание"],"a":2,"g":0},{"id":"upk-79","k":"upk","n":79,"q":"Что не является мерой пресечения?","o":["личное поручительство","обязательство являться по вызову органа, ведущего процесс","отдача несовершеннолетнего под присмотр","домашний арест"],"a":1,"g":0},{"id":"upk-80","k":"upk","n":80,"q":"Уголовное судопроизводство осуществляется в соответствии с уголовно-процессуальным законом, введенным в действие к моменту выполнения процессуального действия, принятия процессуального решения. Это утверждение является","o":["действием уголовно-процессуального закона во времени","действием уголов     const r = DATA.qs.filter(q => q.k === t.k && P.right[q.id]).length;
    const w = DATA.qs.filter(q => q.k === t.k && P.wrong[q.id]).length;
    h += `<label class="row"><input type="checkbox" data-k="${t.k}" ${cfg.sel.has(t.k) ? "checked" : ""}><div class="t">${esc(t.t)}<div class="m">${t.n} вопр. · верно ${r} · ошибок ${w}</div><div class="bar"><i style="width:${Math.round(100 * r / t.n)}%"></i></div></div></label>`;
  });
  h += `</div><div class="modes">`;
  [["order","По порядку","Как в файле"],["shuffle","Вперемешку","Все выбранные темы"],["wrong","Работа над ошибками","Только то, где ошибался"],["exam","Пробный тест","20 случайных, как на тесте"]].forEach(m => {
    h += `<button class="mode" data-m="${m[0]}" aria-pressed="${cfg.mode === m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`;
  });
  h += `</div><label class="sw"><input type="checkbox" id="inst" ${cfg.instant && cfg.mode !== "exam" ? "checked" : ""} ${cfg.mode === "exam" ? "disabled" : ""}>Показывать правильный ответ сразу</label>`;
  h += `<button class="btn" id="go" ${cnt ? "" : "disabled"}>${cnt ? "Начать: " + cnt + " вопр." : (cfg.mode === "wrong" ? "Ошибок пока нет" : "Выбери хотя бы одну тему")}</button>`;
  h += `<button class="rst" id="rst">Сбросить прогресс</button>`;
  $app.innerHTML = h;
  $app.querySelectorAll("[data-k]").forEach(e => e.onchange = () => { e.checked ? cfg.sel.add(e.dataset.k) : cfg.sel.delete(e.dataset.k); home(); });
  $app.querySelectorAll("[data-m]").forEach(e => e.onclick = () => { cfg.mode = e.dataset.m; home(); });
  const inst = document.getElementById("inst"); inst.onchange = () => cfg.instant = inst.checked;
  document.getElementById("go").onclick = start;
  document.getElementById("rst").onclick = () => { if (confirm("Стереть весь прогресс и список ошибок?")) { P = {right:{}, wrong:{}}; save(); home(); } };
  window.scrollTo(0, 0);
}

function start(ids) {
  let list;
  if (Array.isArray(ids)) list = ids.map(i => byId[i]);
  else {
    list = DATA.qs.filter(q => cfg.sel.has(q.k));
    if (cfg.mode === "wrong") list = list.filter(q => P.wrong[q.id]);
    if (cfg.mode !== "order") list = shuffle(list);
    if (cfg.mode === "exam") list = list.slice(0, 20);
  }
  run = { list, i: 0, picked: null, results: [], instant: Array.isArray(ids) ? true : (cfg.mode === "exam" ? false : cfg.instant) };
  quiz();
}

function quiz() {
  const q = run.list[run.i], r = run.results[run.i];
  const shown = run.instant && r !== undefined;
  let h = `<div class="top"><button id="back">‹ Выйти</button><span class="c">${run.i + 1} / ${run.list.length}</span></div><div class="bar"><i style="width:${Math.round(100 * run.i / run.list.length)}%"></i></div>`;
  h += `<div class="topic" style="margin-top:14px">${esc(tname[q.k])}, вопрос ${q.n}</div><div class="q">${esc(q.q)}</div>`;
  if (q.g) h += `<div class="note">В исходном файле у этого вопроса ответ не отмечен. Показан наиболее вероятный вариант, лучше перепроверить по кодексу.</div>`;
  q.o.forEach((o, i) => {
    let c = "opt";
    if (shown) { if (i === q.a) c += " ok"; else if (i === r) c += " bad"; }
    else if (r === i) c += " sel";
    h += `<button class="${c}" data-i="${i}" ${shown ? "disabled" : ""}><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`;
  });
  h += `<div class="gap"></div>`;
  if (r === undefined) h += `<button class="btn alt" id="show">${run.instant ? "Показать ответ" : "Пропустить"}</button>`;
  else {
    const last = run.i === run.list.length - 1;
    h += `<button class="btn" id="next">${last ? "Завершить" : "Дальше"}</button>`;
  }
  $app.innerHTML = h;
  document.getElementById("back").onclick = () => { if (confirm("Выйти? Результаты этого захода сохранятся.")) home(); };
  $app.querySelectorAll(".opt").forEach(e => e.onclick = () => pick(+e.dataset.i));
  const sh = document.getElementById("show"); if (sh) sh.onclick = () => pick(-1);
  const nx = document.getElementById("next"); if (nx) nx.onclick = next;
  window.scrollTo(0, 0);
}

function pick(i) {
  if (run.results[run.i] !== undefined && run.instant) return;
  const q = run.list[run.i];
  run.results[run.i] = i;
  if (i === q.a) { P.right[q.id] = 1; delete P.wrong[q.id]; } else { P.wrong[q.id] = 1; delete P.right[q.id]; }
  save();
  if (run.instant) quiz(); else next();
}

function next() {
  if (run.i < run.list.length - 1) { run.i++; quiz(); } else finish();
}

function finish() {
  const bad = run.list.filter((q, i) => run.results[i] !== q.a);
  const ok = run.list.length - bad.length, pct = Math.round(100 * ok / run.list.length);
  let h = `<h1>Результат</h1><div class="score">${ok} из ${run.list.length}</div><p class="sub">${pct}% верных ответов.${bad.length ? "" : " Ошибок нет."}</p>`;
  if (bad.length) {
    h += `<button class="btn" id="redo">Повторить ошибки (${bad.length})</button><div class="gap"></div>`;
  }
  h += `<button class="btn alt" id="home">На главную</button>`;
  bad.forEach(q => {
    const i = run.list.indexOf(q), y = run.results[i];
    h += `<div class="wr"><div class="topic">${esc(tname[q.k])}, вопрос ${q.n}</div><p>${esc(q.q)}</p>${y >= 0 ? `<p class="y">Твой ответ: ${L[y]}) ${esc(q.o[y])}</p>` : `<p class="y">Ответ не выбран</p>`}<p class="a">Верно: ${L[q.a]}) ${esc(q.o[q.a])}</p></div>`;
  });
  $app.innerHTML = h;
  const re = document.getElementById("redo"); if (re) re.onclick = () => start(shuffle(bad.map(q => q.id)));
  document.getElementById("home").onclick = home;
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (!run || !document.getElementById("back")) return;
  const idx = "1234567".indexOf(e.key);
  if (idx >= 0 && idx < run.list[run.i].o.length && !document.getElementById("next")) pick(idx);
  if ((e.key === "Enter" || e.key === "ArrowRight") && document.getElementById("next")) next();
});
home();
</script>
</body>
</html>
